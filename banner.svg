<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0f8"/>
      <stop offset="0.45" stop-color="#ff5fae"/>
      <stop offset="1" stop-color="#c2185b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.3" fill="#000" opacity="0.35"/>
    </pattern>
    <clipPath id="typeclip">
      <rect x="150" y="262" height="30" width="0">
        <animate attributeName="width" values="0;0;700;700;0" keyTimes="0;0.08;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ff5fae" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="400" fill="#000"/>
  <rect width="1000" height="400" fill="url(#halo)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- window bar -->
  <g font-size="13" fill="#8d7f88">
    <circle cx="26" cy="22" r="5" fill="#ff5fae"/><circle cx="46" cy="22" r="5" fill="#c2185b"/><circle cx="66" cy="22" r="5" fill="#5a2a45"/>
    <text x="90" y="27">nr01x@fire:~/profile</text>
    <text x="974" y="27" text-anchor="end" fill="#ff5fae">● ONLINE<animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></text>
  </g>

  <!-- ASCII fire: rows from sparse (top) to dense (bottom) -->
  <g font-size="17" font-weight="700" fill="#ff5fae" textLength="1000">
    <text x="0" y="318" textLength="1000" lengthAdjust="spacing" opacity="0.35" fill="#ffb8da">.  '   `  .   '  ,   .  `   '  .  ,    '   .   `  '   .  ,   '  .   `   .  '   ,  .   '   `  .  '   ,   .   `  '  .   ,  '
      <animate attributeName="opacity" values="0.15;0.5;0.15" dur="1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="1.7s" repeatCount="indefinite"/></text>
    <text x="0" y="336" textLength="1000" lengthAdjust="spacing" opacity="0.5" fill="#ffb8da">,:  ;'  :,  ;`  :;  ,'  ;:  `,  :;  ',  ;:  `;  ,:  ';  :`  ,;  :'  ;,  `:  ;'  ,:  ;`  :,  ';  :`  ,;  :'  ;,  `:
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="1.2s" repeatCount="indefinite"/></text>
    <text x="0" y="354" textLength="1000" lengthAdjust="spacing" opacity="0.7">;-~=+*;-~=+*x;-~=+*;-~=+x*;-~=+*;-~=+*x;-~=+*;-~=+x*;-~=+*;-~=+*x;-~=+*;-~=+x*;-~=+*;-~=+*x;-~=+*;-~=+x*;-~=+*
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0;0,-2;0,0" dur="0.9s" repeatCount="indefinite"/></text>
    <text x="0" y="372" textLength="1000" lengthAdjust="spacing" fill="#ff3d9a">xX%#&amp;@xX%#&amp;@%#X&amp;@xX%#&amp;@%X#&amp;@xX%#&amp;@xX%#&amp;@%#X&amp;@xX%#&amp;@%X#&amp;@xX%#&amp;@xX%#&amp;@%#X&amp;@xX%#&amp;@%X#&amp;@
      <animate attributeName="opacity" values="0.8;1;0.8" dur="0.6s" repeatCount="indefinite"/></text>
    <text x="0" y="392" textLength="1000" lengthAdjust="spacing" fill="#c2185b">@@#%&amp;@#%@&amp;#@%@@&amp;%#@@#%&amp;@#%@&amp;@@#%&amp;@#%@&amp;#@%@@&amp;%#@@#%&amp;@#%@&amp;@@#%&amp;@#%@&amp;#@%@@&amp;%#@@#%&amp;@#%@&amp;@@#%&amp;@
      <animate attributeName="opacity" values="1;0.75;1" dur="0.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- embers -->
  <g font-size="16" font-weight="700" fill="#ffb8da">
    <text x="120" y="360">*<animateTransform attributeName="transform" type="translate" values="0,0;14,-300" dur="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite"/></text>
    <text x="260" y="360">.<animateTransform attributeName="transform" type="translate" values="0,0;-18,-320" dur="5.1s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.1s" begin="0.8s" repeatCount="indefinite"/></text>
    <text x="410" y="360">+<animateTransform attributeName="transform" type="translate" values="0,0;22,-290" dur="3.8s" begin="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.8s" begin="1.6s" repeatCount="indefinite"/></text>
    <text x="560" y="360">'<animateTransform attributeName="transform" type="translate" values="0,0;-10,-330" dur="4.7s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.7s" begin="0.3s" repeatCount="indefinite"/></text>
    <text x="690" y="360">*<animateTransform attributeName="transform" type="translate" values="0,0;16,-310" dur="5.4s" begin="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.4s" begin="2.2s" repeatCount="indefinite"/></text>
    <text x="820" y="360">.<animateTransform attributeName="transform" type="translate" values="0,0;-20,-300" dur="4s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1.1s" repeatCount="indefinite"/></text>
    <text x="900" y="360">`<animateTransform attributeName="transform" type="translate" values="0,0;12,-320" dur="4.9s" begin="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.9s" begin="2.8s" repeatCount="indefinite"/></text>
  </g>

  <!-- logotype with glitch layers -->
  <g font-size="170" font-weight="900" text-anchor="middle">
    <text x="500" y="215" fill="#00e5ff" opacity="0">NR01X
      <animate attributeName="opacity" values="0;0;0.75;0;0" keyTimes="0;0.9;0.92;0.95;1" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;-9,2;0,0;0,0" keyTimes="0;0.9;0.92;0.95;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="500" y="215" fill="#ff2d7a" opacity="0">NR01X
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;10,-2;0,0;0,0" keyTimes="0;0.9;0.93;0.96;1" dur="4s" repeatCount="indefinite"/></text>
    <text x="500" y="215" fill="url(#pk)" filter="url(#glow)">NR01X
      <animate attributeName="opacity" values="1;0.92;1;0.96;1" dur="2.4s" repeatCount="indefinite"/></text>
  </g>

  <!-- typing tagline -->
  <g font-size="21" font-weight="700">
    <text x="118" y="283" fill="#8d7f88">$</text>
    <g clip-path="url(#typeclip)">
      <text x="150" y="283" fill="#ffb8da">Python mastery. Precise AI orchestration. Zero AI smell.</text>
    </g>
    <rect x="150" y="265" width="12" height="22" fill="#ff5fae">
      <animate attributeName="x" values="150;150;850;850;150" keyTimes="0;0.08;0.5;0.92;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- scanlines + sweeping beam -->
  <rect width="1000" height="400" fill="url(#scan)" opacity="0.6"/>
  <rect y="0" width="1000" height="3" fill="#ff5fae" opacity="0.25">
    <animate attributeName="y" values="-10;410" dur="5s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
